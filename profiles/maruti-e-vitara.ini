# Maruti Suzuki e Vitara — UNOFFICIAL reference layout.
# Public specs: Automotive Grade Linux + Qt for cluster and infotainment (Qt/Suzuki, Sept 2025);
# 10.1" driver display + 10.25" touchscreen. Resolutions ASSUMED.

[vehicle]
name = Maruti Suzuki e Vitara (reference)
oem_profile = maruti-e-vitara
signals = Vehicle.Speed, Vehicle.Powertrain.TractionBattery.StateOfCharge.Displayed, Vehicle.Powertrain.Range
notes = AGL + Qt target: car/qt-cluster is the reference receiver

[display.0]
name = Driver display 10.1in
role = cluster
width = 1920
height = 720
safety = safety-critical
accepts = theme, cards

[display.1]
name = Touchscreen 10.25in
role = center
width = 1920
height = 720
safety = driver-visible
accepts = video, theme, cards

[theme.default]
id = oem-default
name = Car default
background = #0E1116
foreground = #F0F3F7
accent = #5C9DFF
gauge_style = classic
