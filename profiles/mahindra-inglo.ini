# Mahindra INGLO EVs (BE 6 / XEV 9e / XEV 9S) — UNOFFICIAL reference layout.
# Public specs: Snapdragon SA8295P, Android Automotive (inferred), three 12.3" screens on the XEV 9e
# (driver, center, passenger). Resolutions are ASSUMED (typical 12.3" 1920x720) until Mahindra confirms.

[vehicle]
name = Mahindra INGLO EV (reference)
oem_profile = mahindra-inglo
signals = Vehicle.Speed, Vehicle.Powertrain.TractionBattery.StateOfCharge.Displayed, Vehicle.Powertrain.Range
notes = AAOS on SA8295P; cluster HMI engine not disclosed (Kanzi/Unreal/Qt per job ads)

[display.0]
name = Driver display 12.3in
role = cluster
width = 1920
height = 720
refresh = 60
safety = safety-critical
accepts = theme, cards

[display.1]
name = Center screen 12.3in
role = center
width = 1920
height = 720
refresh = 60
safety = driver-visible
accepts = video, theme, cards

[display.2]
name = Passenger screen 12.3in
role = passenger
width = 1920
height = 720
refresh = 60
safety = infotainment
accepts = video

[theme.default]
id = oem-default
name = Car default
background = #0A0F1A
foreground = #F2F4F8
accent = #3FA9F5
gauge_style = minimal
