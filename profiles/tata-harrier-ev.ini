# Tata Harrier.ev — UNOFFICIAL reference layout.
# Public specs: 14.53" Harman center screen (Samsung Neo QLED panel), digital cluster (10.25" vs 12.3" reported),
# cockpit domain controller with Qualcomm Snapdragon + Continental processors (T.idal). Resolutions ASSUMED.

[vehicle]
name = Tata Harrier.ev (reference)
oem_profile = tata-harrier-ev
signals = Vehicle.Speed, Vehicle.Powertrain.TractionBattery.StateOfCharge.Displayed, Vehicle.Powertrain.Range
notes = Arcade.ev runs on the Harman Ignite Store (AAOS-compliant)

[display.0]
name = Cluster
role = cluster
width = 1920
height = 720
safety = safety-critical
accepts = theme, cards

[display.1]
name = Center screen 14.53in
role = center
width = 2560
height = 1440
safety = driver-visible
accepts = video, theme, cards

[theme.default]
id = oem-default
name = Car default
background = #0B0E14
foreground = #EDEFF2
accent = #4DD0E1
gauge_style = sport
