# Tata Sierra (Horizon View) — UNOFFICIAL reference layout.
# Public specs: 10.25" cluster + 12.3" center + 12.3" passenger; Harman head unit, Ready Link marketplace
# for in-vehicle Android apps. Resolutions ASSUMED.

[vehicle]
name = Tata Sierra (reference)
oem_profile = tata-sierra
signals = Vehicle.Speed, Vehicle.Powertrain.FuelSystem.Level, Vehicle.Powertrain.Range
notes = Harman Ignite / Ready Link distribution path; cluster already shows projected maps via AA/CarPlay

[display.0]
name = Cluster 10.25in
role = cluster
width = 1920
height = 720
safety = safety-critical
accepts = theme, cards

[display.1]
name = Center screen 12.3in
role = center
width = 1920
height = 720
safety = driver-visible
accepts = video, cards

[display.2]
name = Passenger screen 12.3in
role = passenger
width = 1920
height = 720
safety = infotainment
accepts = video

[theme.default]
id = oem-default
name = Car default
background = #0D0D12
foreground = #FFFFFF
accent = #26C6DA
gauge_style = classic
