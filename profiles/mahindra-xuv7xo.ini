# Mahindra XUV 7XO (ADRENOX+) — UNOFFICIAL reference layout.
# Public specs: Visteon SmartCore Pro, Snapdragon SA8155P, QNX Hypervisor host with Android guest
# (QNX confirmed for AdrenoX/XUV700), three 12.3" screens. Resolutions ASSUMED.

[vehicle]
name = Mahindra XUV 7XO (reference)
oem_profile = mahindra-xuv7xo
signals = Vehicle.Speed, Vehicle.Powertrain.FuelSystem.Level, Vehicle.Powertrain.Range
notes = QNX host on Visteon SmartCore Pro; core builds for QNX unchanged (POSIX)

[display.0]
name = Driver display 12.3in
role = cluster
width = 1920
height = 720
safety = safety-critical
accepts = theme, cards

[display.1]
name = Center screen 12.3in
role = center
width = 1920
height = 720
safety = driver-visible
accepts = video, cards

[display.2]
name = Passenger screen 12.3in
role = passenger
width = 1920
height = 720
safety = infotainment
accepts = video

[theme.default]
id = oem-default
name = Car default
background = #101010
foreground = #F5F5F5
accent = #B0BEC5
gauge_style = classic
